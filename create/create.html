<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>자기소개서 생성</title>
  <link rel="stylesheet" href="create.css" />
</head>
<body>
  <div class="layout" id="layout">

    <!-- ===== 왼쪽 사이드바 ===== -->
    <div class="sidebar" id="sidebar">
      <button class="sidebar-toggle-btn" onclick="toggleSidebar()">📜 내역</button>
      <div class="sidebar-header">📜 내 활동 내역</div>
      <div id="historyList" class="history-list">불러오는 중...</div>
    </div>

    <!-- 리사이저 -->
    <div class="resizer" id="resizer" title="드래그해서 너비 조절"></div>

    <!-- ===== 오른쪽 메인 ===== -->
    <div class="main" id="main">
      <div class="header">
        <div class="left-controls">
          <button class="home-btn" onclick="goToSelect()">🏠 선택화면으로</button>
        </div>

        <div class="right-controls" style="position: relative;">
          <button class="account-btn" onclick="toggleAccount()">내 계정</button>
          <div id="accountDropdown" class="dropdown">
            <p id="currentUser"></p>
            <a href="../login/forgot.html">⚙️ 비밀번호 변경/찾기</a>
            <button onclick="logout()">🚪 로그아웃</button>
          </div>
        </div>
      </div>

      <div class="output-container" id="outputContainer">
        <div class="output">GPT 생성 화면입니다.</div>
      </div>

      <div class="input-bar">
        <textarea id="userInput" placeholder="키워드 또는 경험을 입력하세요..." oninput="updateCharCount()"></textarea>
        <div class="footer">
          <span class="char-count" id="charCount">0자</span>
          <button class="send-btn" onclick="generateEssay()">생성하기</button>
        </div>
      </div>

    </div>
  </div>

  <!-- 기존 JS -->
  <script src="create.js"></script>

  <!-- 리사이저/히스토리 로직 -->
  <script>
    const API = "https://ai-cover-letter-feedback-production.up.railway.app";

    // ===========================
    // 계정 드롭다운 닫기
    // ===========================
    window.addEventListener("click", (e) => {
      const btn = e.target.closest(".account-btn");
      const dd  = document.getElementById("accountDropdown");
      if (!btn && dd && dd.classList.contains("show")) dd.classList.remove("show");
    });

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const resizer = document.getElementById('resizer');
      sidebar.classList.toggle('hidden');
      resizer.classList.toggle('at-edge', sidebar.classList.contains('hidden'));
      localStorage.setItem('sidebarHidden', sidebar.classList.contains('hidden') ? '1' : '0');
    }

    // ===========================
    // 히스토리 로드
    // ===========================
    async function loadHistory() {
      const token = localStorage.getItem('token');
      if (!token) return;

      try {
        const res = await fetch(`${API}/history`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await res.json();
        const history = data.history || [];
        const list = document.getElementById('historyList');

        list.innerHTML = '';

        if (history.length === 0) {
          list.innerHTML = '<p style="padding:15px;">히스토리가 없습니다.</p>';
          return;
        }

        history.forEach((item, i) => {
          const div = document.createElement('div');
          div.className = 'history-item';
          const preview = (item.output || '').replace(/\s+/g, ' ').slice(0, 20);

          div.textContent = `${i + 1}. ${new Date(item.createdAt).toLocaleString()} · ${preview}`;
          
          div.onclick = () => {
            const container = document.getElementById('outputContainer');
            const newOutput = document.createElement('div');
            newOutput.className = 'output';
            newOutput.textContent = item.output || '';
            container.prepend(newOutput);
          };

          list.appendChild(div);
        });

      } catch (err) {
        console.error("히스토리 로드 오류:", err);
      }
    }

    // ===========================
    // 리사이저 로직
    // ===========================
    (function setupResizer() {
      const sidebar = document.getElementById('sidebar');
      const resizer = document.getElementById('resizer');

      const savedWidth  = localStorage.getItem('sidebarWidth');
      const savedHidden = localStorage.getItem('sidebarHidden') === '1';
      if (savedWidth) sidebar.style.width = savedWidth;
      if (savedHidden) {
        sidebar.classList.add('hidden');
        resizer.classList.add('at-edge');
      }

      let dragging = false;
      const MIN = 180, MAX = 500;

      resizer.addEventListener('mousedown', (e) => {
        if (sidebar.classList.contains('hidden')) return;
        dragging = true;
        document.body.classList.add('resizing');
        e.preventDefault();
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        let newW = Math.max(MIN, Math.min(MAX, e.clientX));
        sidebar.style.width = `${newW}px`;
      });

      window.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        document.body.classList.remove('resizing');
        localStorage.setItem('sidebarWidth', getComputedStyle(sidebar).width);
      });

      resizer.addEventListener('dblclick', (e) => {
        if (e.shiftKey) {
          sidebar.classList.remove('hidden');
          resizer.classList.remove('at-edge');
          sidebar.style.width = '260px';
          localStorage.setItem('sidebarWidth', '260px');
          localStorage.setItem('sidebarHidden', '0');
        } else {
          toggleSidebar();
        }
      });
    })();

    // 초기 히스토리 로드
    loadHistory();
  </script>
</body>
</html>
